<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProductivityTools.HostBook</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    /* Login Form */
    #login-view {
      max-width: 400px;
      margin: 4rem auto;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 0.375rem;
    }

    input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 0.5rem;
      padding: 0.5rem 0.875rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #0f172a;
      width: 100%;
      padding: 0.65rem;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.75rem;
      display: none;
    }

    /* Table */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .host-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .os-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
    }

    .ip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .ip-chip {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.875rem;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 0.375rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .ip-chip:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .status-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.online {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .dot.stale {
      background: var(--warning);
    }

    .actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--success);
      color: #052e16;
      font-weight: 600;
      padding: 0.65rem 1.1rem;
      border-radius: 0.5rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🖥️ ProductivityTools.HostBook</h1>
      <div id="user-controls" class="hidden">
        <button id="logout-btn" class="btn-outline">Wyloguj</button>
      </div>
    </header>

    <!-- Widok logowania -->
    <div id="login-view" class="card hidden">
      <h2 style="margin-bottom: 1rem; font-size: 1.2rem;">Logowanie</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" value="hostbook@tech.user" required />
        </div>
        <div class="form-group">
          <label for="password">Hasło</label>
          <input type="password" id="password" placeholder="Wpisz hasło..." required autofocus />
        </div>
        <button type="submit" class="btn-primary">Zaloguj</button>
        <div id="login-error" class="error-msg"></div>
      </form>
    </div>

    <!-- Widok tabeli -->
    <div id="dashboard-view" class="card hidden">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Komputer</th>
              <th>System</th>
              <th>Adresy IP (kliknij aby skopiować)</th>
              <th>Ostatnia aktualizacja</th>
              <th>Szybkie akcje</th>
            </tr>
          </thead>
          <tbody id="hosts-tbody">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--muted);">Ładowanie danych...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Skopiowano do schowka!</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: ["AIzaSyAxmnZm4", "597RcMVQeJrby3HpuDfzYyTJoU"].join(""),
      databaseURL: "https://ptprojectsweb-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ptprojectsweb"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const loginView = document.getElementById("login-view");
    const dashboardView = document.getElementById("dashboard-view");
    const userControls = document.getElementById("user-controls");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const hostsTbody = document.getElementById("hosts-tbody");
    const logoutBtn = document.getElementById("logout-btn");
    const toast = document.getElementById("toast");

    let hostsRef = null;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function copyText(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(label || `Skopiowano: ${text}`);
      });
    }

    function downloadRdp(ip, hostname) {
      const content = [
        `full address:s:${ip}:3389`,
        `prompt for credentials:i:1`,
        `administrative session:i:1`
      ].join("\r\n");
      const blob = new Blob([content], { type: "application/x-rdp" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${hostname}-${ip}.rdp`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function isRecent(updatedAtStr) {
      if (!updatedAtStr) return false;
      const parsed = new Date(String(updatedAtStr).replace(" ", "T"));
      if (isNaN(parsed.getTime())) return true;
      const diffMinutes = (Date.now() - parsed.getTime()) / 60000;
      return diffMinutes <= 15;
    }

    function renderHosts(data) {
      hostsTbody.innerHTML = "";
      if (!data) {
        hostsTbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--muted);">Brak zarejestrowanych komputerów w bazie.</td></tr>`;
        return;
      }

      const entries = Object.entries(data).sort((a, b) =>
        (a[1].hostname || a[0]).localeCompare(b[1].hostname || b[0])
      );

      for (const [key, host] of entries) {
        const hostname = host.hostname || key;
        const os = host.os || "-";
        const ips = Array.isArray(host.ips)
          ? host.ips
          : host.ip
          ? [host.ip]
          : [];
        const updatedAt = host.updatedAt || "-";
        const online = isRecent(updatedAt);
        const primaryIp = ips[0] || "";

        const tr = document.createElement("tr");

        const ipsHtml = ips.length
          ? ips
              .map(
                (ip) =>
                  `<span class="ip-chip" onclick="copyText('${ip}', 'Skopiowano IP: ${ip}')" title="Kliknij aby skopiować">${ip} 📋</span>`
              )
              .join("")
          : `<span style="color:var(--muted)">Brak IP</span>`;

        const actionsHtml = primaryIp
          ? `
            <button class="btn-outline" onclick="copyText('ssh ${primaryIp}', 'Skopiowano: ssh ${primaryIp}')">Kopiuj SSH</button>
            <button class="btn-outline" onclick="downloadRdp('${primaryIp}', '${hostname}')">Pobierz RDP</button>
          `
          : "-";

        tr.innerHTML = `
          <td class="host-name">${hostname}</td>
          <td><span class="os-badge">${os}</span></td>
          <td><div class="ip-list">${ipsHtml}</div></td>
          <td>
            <div class="status-wrap">
              <span class="dot ${online ? "online" : "stale"}" title="${online ? "Aktywny (<15 min)" : "Starszy raport"}"></span>
              <span>${updatedAt}</span>
            </div>
          </td>
          <td><div class="actions">${actionsHtml}</div></td>
        `;
        hostsTbody.appendChild(tr);
      }
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        loginView.classList.add("hidden");
        dashboardView.classList.remove("hidden");
        userControls.classList.remove("hidden");

        hostsRef = db.ref("hosts");
        hostsRef.on(
          "value",
          (snapshot) => {
            renderHosts(snapshot.val());
          },
          (error) => {
            hostsTbody.innerHTML = `<tr><td colspan="5" style="color:var(--danger);">Błąd odczytu bazy: ${error.message}</td></tr>`;
          }
        );
      } else {
        if (hostsRef) hostsRef.off();
        loginView.classList.remove("hidden");
        dashboardView.classList.add("hidden");
        userControls.classList.add("hidden");
      }
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.style.display = "none";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        loginError.textContent = "Błąd logowania: nieprawidłowy e-mail lub hasło.";
        loginError.style.display = "block";
      }
    });

    logoutBtn.addEventListener("click", () => auth.signOut());
  </script>
</body>
</html>
